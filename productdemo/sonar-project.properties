# SonarQube Project Configuration
# For detailed documentation: https://docs.sonarqube.org/latest/analysis/analysis-parameters/

# Project identification
sonar.projectKey=Vernfix_productdemo
sonar.projectName=ProductDemo
sonar.projectVersion=0.0.1

# Organization (for SonarCloud)
sonar.organization=vernfix

# Source code location
sonar.sources=src/main/java
sonar.tests=src/test/java

# Exclusions (don't analyze these)
sonar.exclusions=**/config/**,**/dto/**

# Test inclusions
sonar.test.inclusions=src/test/java/**/*Test.java,src/test/java/**/*Tests.java

# Coverage
sonar.coverage.jacoco.xmlReportPaths=target/coverage-reports/jacoco.xml

# Code coverage minimum
sonar.coverage.exclusions=\
  **/entity/**,\
  **/config/**,\
  **/ProductdemoApplication.java

# Debugging
# sonar.verbose=true
# sonar.log.level=DEBUG

# Language
sonar.language=java

# Java version
sonar.java.source=21
sonar.java.target=21

# Encoding
sonar.sourceEncoding=UTF-8
